# DynamoDB Local -- the bot's business state, entirely on your machine.
# -inMemory: data resets when the container stops (just re-run seed.py).
# -sharedDb: one shared database regardless of AWS creds/region, so the seed
#            script and the agent always see the same tables.
services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: refund-ddb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
